<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Connexion - Paroisse Saint Joseph d'Agbatô

    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <!-- LOGO GAUCHE -->
    <img
    src="images/e5a1b715e3caed24b602ba4669a7cc87.jpg"
    alt="Saint Joseph"
    class="logo-left">

    <!-- LOGO DROITE -->
    <img
    src="images/OIP.webp"
    alt="Archidiocèse"
    class="logo-right">

    <h1>

        Connexion des Membres

    </h1>

    <p>

        Paroisse Saint Joseph d'Agbatô

    </p>

</header>



<div class="container">

    <section class="admin-box">

        <h2>

            Se connecter

        </h2>



        <form id="loginForm">

            <!-- EMAIL -->
            <input
            type="email"
            id="loginEmail"
            placeholder="Adresse Email"
            required>



            <!-- MOT DE PASSE -->
            <input
            type="password"
            id="loginPassword"
            placeholder="Mot de passe"
            required>

            <br><br>



            <!-- BOUTON -->
            <button type="submit">

                Connexion

            </button>

        </form>



        <br>



        <!-- CREER UN COMPTE -->
        <a href="register.html">

            <button>

                Créer un compte

            </button>

        </a>



        <br><br>



        <!-- RETOUR ACCUEIL -->
        <a href="index.html">

            <button>

                Retour à l'accueil

            </button>

        </a>

    </section>

</div>



<footer>

    <p>

        © 2026 Paroisse Saint Joseph d'Agbatô

    </p>

</footer>



<!-- JAVASCRIPT -->
<script type="module" src="script.js"></script>

</body>
</html>
