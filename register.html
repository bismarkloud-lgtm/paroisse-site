<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Création de Compte - Paroisse Saint Joseph d'Agatô

    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <!-- LOGO GAUCHE -->
    <img
    src="images/e5a1b715e3caed24b602ba4669a7cc87.jpg"
    alt="Saint Joseph"
    class="logo-left">

    <!-- LOGO DROITE -->
    <img
    src="images/OIP.webp"
    alt="Archidiocèse"
    class="logo-right">

    <h1>

        Création de Compte

    </h1>

    <p>

        Paroisse Saint Joseph d'Agatô

    </p>

</header>



<div class="container">

    <section class="admin-box">

        <h2>

            Inscription Membre

        </h2>



        <form id="formulaireRegister">

            <!-- NOM -->
            <input
            type="text"
            id="registerNom"
            placeholder="Nom complet"
            required>



            <!-- EMAIL -->
            <input
            type="email"
            id="registerEmail"
            placeholder="Adresse Email"
            required>



            <!-- MOT DE PASSE -->
            <input
            type="password"
            id="registerPassword"
            placeholder="Mot de passe"
            required>

            <br><br>



            <!-- BOUTON -->
            <button type="submit">

                Créer le compte

            </button>

        </form>

        <br>



        <!-- CONNEXION -->
        <a href="login.html">

            <button>

                Déjà un compte ?

            </button>

        </a>

    </section>

</div>



<footer>

    <p>

        © 2026 Paroisse Saint Joseph d'Agatô

    </p>

</footer>



<!-- JAVASCRIPT -->
<script type="module" src="script.js"></script>

</body>
</html>
