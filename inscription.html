<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>

        Inscription - Paroisse Saint Joseph d'Agbato

    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <!-- LOGO GAUCHE -->
    <img
    src="images/e5a1b715e3caed24b602ba4669a7cc87.jpg"
    alt="Saint Joseph"
    class="logo-left">

    <!-- LOGO DROITE -->
    <img
    src="images/OIP.webp"
    alt="Archidiocèse"
    class="logo-right">

    <h1>

        Formulaire d'Inscription

    </h1>

    <p>

        Paroisse Saint Joseph d'Agbato

    </p>

</header>



<div class="container">

    <section class="admin-box">

        <h2>

            Informations du fidèle

        </h2>



        <form id="formulaireInscription">

            <!-- NOM -->
            <input
            type="text"
            id="nom"
            placeholder="Nom"
            required>



            <!-- PRENOM -->
            <input
            type="text"
            id="prenom"
            placeholder="Prénom"
            required>



            <!-- TELEPHONE -->
            <input
            type="tel"
            id="telephone"
            placeholder="Téléphone"
            required>



            <!-- EMAIL -->
            <input
            type="email"
            id="email"
            placeholder="Adresse Email"
            required>



            <!-- ADRESSE -->
            <input
            type="text"
            id="adresse"
            placeholder="Adresse"
            required>



            <!-- GROUPE -->
            <select
            id="groupe"
            required>

                <option value="">
                    Choisir un groupe
                </option>

                <option>
                    Enfance Missionnaire
                </option>

                <option>
                    Coordination des Jeunes
                </option>

                <option>
                    Coordination de la Catéchèse
                </option>

                <option>
                    Coordination des CEB
                </option>

                <option>
                    Groupes de Prière
                </option>

            </select>

            <br><br>



            <!-- BOUTON -->
            <button type="submit">

                S'inscrire

            </button>

        </form>

    </section>

</div>



<footer>

    <p>

        © 2026 Paroisse Saint Joseph d'Agbato

    </p>

</footer>



<!-- JAVASCRIPT -->
<script type="module" src="script.js"></script>

</body>
</html>
